<!DOCTYPE html>
<html lang="eng">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Asyraf Azlan" />
    <meta name="description" content="Store Hours for The Little Coffee Shop" />
    <title>LCS Hours</title>
    <link rel="icon" href="Coffee.ico" type="image/x-icon" />
    <link rel="stylesheet" href="CSS/style.css" />
    <script src="js/main.js" defer></script>
  </head>

  <body>
    <header class="header">
      <h1 class="header__h1">The Little Coffee Shop Hours</h1>
      <nav class="header__nav">
        <ul class="header__ul">
          <li>
            <a href="/">Home</a>
          </li>
          <li>
            <a href="/#menu">Menu</a>
          </li>
          <li>
            <a href="contact.html">Contact</a>
          </li>
          <li>
            <a href="about.html">About</a>
          </li>
        </ul>
      </nav>
    </header>

    <section class="hero">
      <figure>
        <img
          src="img/yellow_latte 1000x1500.png"
          alt="Latte in Yellow Cup"
          title="Have a nice day with cup of latte!"
          width="1000"
          height="1500"
        />
        <figcaption class="offscreen">Coffee in Yellow Cup</figcaption>
      </figure>
    </section>

    <main class="main">
      <article class="main__article">
        <h2>Hours</h2>
        <p>We are open 7 days a week</p>
        <dl>
          <dt>Sunday-Thursday</dt>
          <dd>11am-9pm</dd>
          <dt>Friday-Saturday</dt>
          <dd>11am-11pm</dd>
        </dl>
      </article>
    </main>

    <footer class="footer">
      <p>
        <span class="nowrap">Copyright &copy; <time id="year"></time></span>
        <span class="nowrap">Little Coffee Shop</span>
      </p>
    </footer>
  </body>
</html>
