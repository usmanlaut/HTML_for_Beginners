<!DOCTYPE html>
<html lang="eng">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Asyraf Azlan" />
    <meta
      name="description"
      content="The official website for The Little Coffee Shop"
    />
    <title>The Little Coffee Shop</title>
    <link rel="icon" href="Coffee.ico" type="image/x-icon" />
    <link rel="stylesheet" href="CSS/style.css" />
    <script src="js/main.js" defer></script>
  </head>

  <body>
    <header class="header">
      <h1 class="header__h1">Little Coffee Shop</h1>
      <nav class="header__nav">
        <ul class="header__ul">
          <li>
            <a href="#menu">Menu</a>
          </li>
          <li>
            <a href="hours.html">Hours</a>
          </li>
          <li>
            <a href="contact.html">Contact</a>
          </li>
        </ul>
      </nav>
    </header>

    <section class="hero">
      <h2 class="hero__h2">Selamat Datang!</h2>
      <figure>
        <img
          src="img/coffee_and_bread 1000x1333.png"
          alt="Coffee and Bread"
          title="We love coffee!"
          width="1000"
          height="1333"
        />
        <figcaption class="offscreen">Coffee and Bread</figcaption>
      </figure>
    </section>

    <main class="main">
      <article id="menu" class="main__article menu">
        <h2 class="menu__h2">Our Menu</h2>
        <table class="menu__container">
          <caption class="offscreen">
            Our Coffees
          </caption>
          <thead>
            <tr>
              <th class="menu__header" scope="col">Coffees</th>
              <th class="menu__header" scope="col">
                <abbr title="Hot or Iced">H/I</abbr>
              </th>
              <th class="menu__header" scope="col">Price</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th class="menu__item menu__latte" scope="row" rowspan="2">
                Lattee
              </th>
              <td class="menu__item">Iced</td>
              <td class="menu__item">RM5.00</td>
            </tr>
            <tr>
              <td class="menu__item">Hot</td>
              <td class="menu__item">RM4.50</td>
            </tr>
            <tr>
              <th class="menu__item menu__americano" scope="row" rowspan="2">
                Americano
              </th>
              <td class="menu__item">Iced</td>
              <td class="menu__item">RM4.50</td>
            </tr>
            <tr>
              <td class="menu__item">Hot</td>
              <td class="menu__item">RM4.00</td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <td class="menu__item menu__addon" colspan="3">
                Add-on Cream or Sugar RM1.00
              </td>
            </tr>
          </tfoot>
        </table>

        <p class="center">
          <a href="#">Back to Top</a>
        </p>
      </article>
    </main>

    <hr />
    <footer class="footer">
      <p>
        <span class="nowrap">Copyright &copy; <time id="year"></time></span>
        <span class="nowrap">Little Coffee Shop</span>
      </p>
    </footer>
  </body>
</html>
